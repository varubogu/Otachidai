[package]
name = "otachidai"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "cleanup"
path = "src/bin/cleanup.rs"

[dependencies]
twilight-gateway = "0.17"
twilight-http = "0.17"
twilight-model = "0.17"
twilight-cache-inmemory = "0.17"
twilight-util = { version = "0.17", features = ["builder"] }
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
fluent-bundle = "0.16"
fluent-syntax = "0.11"
unic-langid = { version = "0.9", features = ["macros"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
